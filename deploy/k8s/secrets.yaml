# DO NOT commit real secrets — use Sealed Secrets, Vault, or external-secrets-operator in production
apiVersion: v1
kind: Secret
metadata:
  name: ct-secrets
  namespace: container-tracking
type: Opaque
stringData:
  DB_CONNECTION_STRING: "Host=postgres-svc;Database=container_tracking;Username=ct_user;Password=REPLACE_ME"
  REDIS_CONNECTION_STRING: "redis-svc:6379,password=REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_WITH_A_SECURE_256_BIT_KEY"
  DB_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
