apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-web
  namespace: container-tracking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ct-web
  template:
    metadata:
      labels:
        app: ct-web
    spec:
      containers:
        - name: ct-web
          image: your-registry/ct-web:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ct-web-svc
  namespace: container-tracking
spec:
  selector:
    app: ct-web
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
